# On a v<VERSION> tag: build every board/machine variant, attach the merged
# images to the GitHub release, and publish the browser installer to GitHub
# Pages. Run it by hand (Actions > Release > Run workflow) to rebuild an
# existing tag. See scripts/build_web_installer.py.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v1.1.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # tags, so the build stamps the plain release number

      - name: Check VERSION matches the tag
        run: test "v$(cat VERSION)" = "$TAG" || { echo "VERSION is $(cat VERSION), tag is $TAG"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool==4.8.1

      - name: Build firmware and installer
        run: PIO=pio python scripts/build_web_installer.py --out site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Rowing Display ${{ env.TAG }}
          body_path: site/release-notes.md
          files: site/release/*.bin

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Keep only the installer page
        run: rm -rf site/release site/release-notes.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
