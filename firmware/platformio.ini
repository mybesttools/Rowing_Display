[env:esp32-s3-devkitc-1]
; ESP32_Display_Panel requires arduino-esp32 >= 3.1.0 (ESP-IDF 5.x APIs for the
; RGB LCD bus). The official platformio/espressif32 platform is stuck bundling
; arduino-esp32 2.0.17 (IDF 4.4), so use the pioarduino community fork instead,
; which tracks current Arduino core releases. Pinned to 51.03.07 specifically:
; it bundles arduino-esp32 3.0.7 / ESP-IDF v5.1.4, the exact toolchain
; Waveshare's own precompiled examples for this board were built with
; (verified by extracting version strings from their shipped binaries) and
; confirmed working here; newer arduino-esp32 releases were tried and hit an
; unexplained regression where Arduino's Serial (HWCDC) never transmits on
; this board even though the low-level IDF console over the same USB port
; works fine (see the printf note in main.cpp).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; This board's ESP32-S3 module is wired for Dual I/O flash + Octal PSRAM
; (confirmed against Waveshare's shipped binaries' image header). Without
; this, PSRAM is never enabled and the RGB LCD driver's ~1.15MB framebuffer
; allocation fails, which panics the chip into a boot-crash loop as soon as
; panel_runtime::begin() runs.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_opi
board_upload.flash_size = 8MB

build_unflags =
    -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -Iinclude
    ; This board only exposes native USB (no separate USB-UART bridge chip),
    ; so Serial must run over USB CDC to be visible at all.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.2
    esp-arduino-libs/esp-lib-utils@^0.2.0
