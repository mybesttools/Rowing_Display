[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

[env:esp32-s3-devkitc-1]
; ESP32_Display_Panel requires arduino-esp32 >= 3.1.0 (ESP-IDF 5.x APIs for the
; RGB LCD bus). The official platformio/espressif32 platform is stuck bundling
; arduino-esp32 2.0.17 (IDF 4.4), so use the pioarduino community fork instead,
; which tracks current Arduino core releases. Pinned to 51.03.07 specifically:
; it bundles arduino-esp32 3.0.7 / ESP-IDF v5.1.4, the exact toolchain
; Waveshare's own precompiled examples for this board were built with
; (verified by extracting version strings from their shipped binaries) and
; confirmed working here; newer arduino-esp32 releases were tried and hit an
; unexplained regression where Arduino's Serial (HWCDC) never transmits on
; this board even though the low-level IDF console over the same USB port
; works fine (see the printf note in main.cpp).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; This board's ESP32-S3 module is wired for Dual I/O flash + Octal PSRAM
; (confirmed against Waveshare's shipped binaries' image header). Without
; this, PSRAM is never enabled and the RGB LCD driver's ~1.15MB framebuffer
; allocation fails, which panics the chip into a boot-crash loop as soon as
; panel_runtime::begin() runs.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_opi
board_upload.flash_size = 8MB

build_unflags =
    -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -Ifirmware/include
    ; This board only exposes native USB (no separate USB-UART bridge chip),
    ; so Serial must run over USB CDC to be visible at all.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL looks for "lv_conf.h" via a flat include path (it's checked into
    ; firmware/include alongside this project's own headers) rather than a
    ; fixed relative path next to the lvgl library folder.
    -DLV_CONF_INCLUDE_SIMPLE=1

build_src_filter =
    +<*>
    -<stern_drive_gif.cpp>
    -<stern_recovery_gif.cpp>

extra_scripts =
    pre:scripts/patch_lvgl_gif_max_width.py

lib_deps =
    h2zero/NimBLE-Arduino@^2.2.2
    esp-arduino-libs/esp-lib-utils@^0.2.0
    lvgl/lvgl@^9.5.0
    ; Used only as an unattached LGFX_Sprite (in-memory drawing canvas) for
    ; the procedural rower_scene animation - never given a real panel/device,
    ; so it never touches the RGB bus directly. See rower_scene.cpp and
    ; scratchpad/agents/BOARD.md for why a live-drawn/scaled widget on the
    ; RGB scan itself is a known tearing hazard on this board.
    lovyan03/LovyanGFX@^1.2.7

; Same board/firmware, targeting the Kuipers AquaRower instead of the
; Dunlop Air Rower — selects firmware/include/profiles/kuipers_aquarower.h
; for the machine-specific physics calibration constants (see config.h).
[env:esp32-s3-devkitc-1-kuipers]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DROWER_PROFILE_KUIPERS_AQUAROWER=1

[env:esp32-s3-lcd5]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DROWING_BOARD_LCD_5=1

[env:esp32-s3-lcd5-kuipers]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DROWING_BOARD_LCD_5=1
    -DROWER_PROFILE_KUIPERS_AQUAROWER=1

[env:native-test]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<metrics_model.cpp>
    +<ftms_encoder.cpp>
build_flags =
    -DUNIT_TEST

[env:esp32-sim]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ignore =
    ESP32_Display_Panel
    ESP32_IO_Expander
    lvgl
build_unflags =
    -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DSIMULATION_MODE=1
    -std=gnu++17
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.2
